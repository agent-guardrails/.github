# Reusable AI release notes. Called from project repos:
#   uses: agent-guardrails/.github/.github/workflows/release-notes.yml@main
name: AI Release Notes (reusable)

on:
  workflow_call:
    inputs:
      models:
        description: "Comma-separated OpenAI-compatible model ids, tried in order"
        required: false
        type: string
        default: "gemini-3.5-flash,gemini-3.5-flash-lite"
      tag:
        description: "Existing release tag (for manual dispatch runs)"
        required: false
        type: string
        default: ""

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out org meta repo (release notes script)
        uses: actions/checkout@v4
        with:
          repository: agent-guardrails/.github
          ref: main
          path: meta

      - name: Generate release notes
        run: python3 meta/.github/scripts/release_notes.py
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          AI_MODELS: ${{ vars.AI_MODELS || inputs.models || 'gemini-3.5-flash,gemini-3.5-flash-lite' }}
