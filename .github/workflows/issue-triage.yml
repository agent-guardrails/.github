# Reusable AI issue triage. Called from project repos:
#   uses: agent-guardrails/.github/.github/workflows/issue-triage.yml@main
name: AI Issue Triage (reusable)

on:
  workflow_call:
    inputs:
      models:
        description: "Comma-separated OpenAI-compatible model ids, tried in order"
        required: false
        type: string
        default: "gemini-3.5-flash,gemini-3.5-flash-lite"
      issue_number:
        description: "Issue number (for manual dispatch runs)"
        required: false
        type: string
        default: ""

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check out org meta repo (triage script)
        uses: actions/checkout@v4
        with:
          repository: agent-guardrails/.github
          ref: main
          path: meta

      - name: Run AI triage
        run: python3 meta/.github/scripts/triage.py
        env:
          ISSUE_NUM: ${{ inputs.issue_number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          AI_MODELS: ${{ vars.AI_MODELS || inputs.models || 'gemini-3.5-flash,gemini-3.5-flash-lite' }}
